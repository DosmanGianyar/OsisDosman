<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koneksi Terputus — Bilik Suara DOSMAN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-retry {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔌</div>
    <h2>Koneksi Server Terputus</h2>
    <p>
      Aplikasi tidak dapat terhubung ke server E-Voting OSIS.<br>
      Pastikan kabel LAN / WiFi terhubung, lalu klik tombol di bawah untuk mencoba kembali.
    </p>
    <button class="btn-retry" onclick="location.reload()">🔄 Coba Hubungkan Kembali</button>
  </div>
</body>
</html>
